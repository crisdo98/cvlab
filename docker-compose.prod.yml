# CVLab -- production-ish run: no source bind mounts, restart on boot,
# bounded resources.
#
#   docker-compose -f docker-compose.prod.yml up --build -d
#
services:
  cvlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvlab:latest
    container_name: cvlab
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
      - ./cv:/app/cv
      - ./exports:/app/exports
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
